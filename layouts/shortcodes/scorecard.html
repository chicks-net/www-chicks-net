{{/* scorecard shortcode — params: owner, repo (required); codecov (any non-empty value, e.g. codecov="true", appends the Codecov badge after the repo link); branch (optional, Codecov badge branch, defaults to "main") */}}<span class="scorecard"><a href="https://scorecard.dev/viewer/?uri=github.com/{{ .Get "owner" }}/{{ .Get "repo" }}"><img src="https://api.scorecard.dev/projects/github.com/{{ .Get "owner" }}/{{ .Get "repo" }}/badge" alt="OpenSSF Scorecard for {{ .Get "owner" }}/{{ .Get "repo" }}" loading="lazy"></a><a href="https://github.com/{{ .Get "owner" }}/{{ .Get "repo" }}">{{ .Get "owner" }}/{{ .Get "repo" }}</a>{{ if .Get "codecov" }}<a href="https://codecov.io/gh/{{ .Get "owner" }}/{{ .Get "repo" }}"><img src="https://codecov.io/gh/{{ .Get "owner" }}/{{ .Get "repo" }}/branch/{{ .Get "branch" | default "main" }}/graph/badge.svg" alt="Codecov coverage for {{ .Get "owner" }}/{{ .Get "repo" }}" loading="lazy"></a>{{ end }}</span>
